<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة الأستاذ أحمد فتحي أبو جبل التعليمية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ===== صفحة الاختيار الرئيسية ===== */
        #main-selection-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* نجوم متحركة في الخلفية */
        #main-selection-page::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 80px 80px, 130px 130px, 200px 200px;
            background-position: 0 0, 40px 40px, 80px 80px;
            animation: starsMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes starsMove {
            0% { background-position: 0 0, 40px 40px, 80px 80px; }
            100% { background-position: 80px 80px, 120px 120px, 160px 160px; }
        }

        /* بطاقة الاختيار المركزية */
        .main-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 680px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* شارة المنصة */
        .platform-badge {
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
            padding: 6px 20px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 50px;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.08);
            animation: badgePulse 3s ease infinite;
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
            50% { box-shadow: 0 0 15px 3px rgba(212, 175, 55, 0.2); }
        }

        /* عنوان المنصة */
        .main-title {
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(255,255,255,0.2);
            line-height: 1.3;
        }

        .main-subtitle {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 45px;
            font-weight: 400;
        }

        /* عنوان الاختيار */
        .choose-label {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* حاوية بطاقات الاختيار */
        .choice-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 0;
        }

        /* بطاقة الاختيار الفردية */
        .choice-card {
            flex: 1;
            max-width: 260px;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .choice-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 22px 22px 0 0;
            transition: opacity 0.3s;
            opacity: 0;
        }

        .choice-card.mult-card::before {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .choice-card.div-card::before {
            background: linear-gradient(90deg, #d4af37, #f3e5ab, #aa771c);
        }

        .choice-card:hover::before {
            opacity: 1;
        }

        .choice-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .choice-card.mult-card:hover {
            background: rgba(102, 126, 234, 0.15);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .choice-card.div-card:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.4);
        }

        /* أيقونة البطاقة */
        .card-icon-wrap {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 900;
            transition: transform 0.3s ease;
        }

        .choice-card:hover .card-icon-wrap {
            transform: scale(1.1) rotate(5deg);
        }

        .mult-card .card-icon-wrap {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            border: 2px solid rgba(102, 126, 234, 0.4);
            color: #a78bfa;
        }

        .div-card .card-icon-wrap {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(170, 119, 28, 0.2));
            border: 2px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
        }

        /* عنوان البطاقة */
        .card-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
        }

        .card-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.6;
        }

        /* خط فاصل */
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #f3e5ab);
            border-radius: 3px;
            margin: 35px auto 25px;
        }

        /* توقيع الأستاذ */
        .teacher-sig {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 30px;
        }

        /* ===== حاوية الـ iframe ===== */
        #app-frame-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
        }

        #app-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== تعديلات الاستجابة للشاشة الرئيسية ===== */
        @media (max-width: 600px) {
            .main-card { padding: 35px 20px; }
            .main-title { font-size: 24px; }
            .choice-cards { flex-direction: column; align-items: center; }
            .choice-card { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ===== صفحة الاختيار الرئيسية ===== -->
    <div id="main-selection-page">
        <div class="main-card">
            <div class="platform-badge">✦ منصة تعليمية متكاملة ✦</div>
            <h1 class="main-title">الأستاذ أحمد فتحي أبو جبل</h1>
            <p class="main-subtitle">اختر النشاط الذي تريد التدرب عليه</p>

            <p class="choose-label">اختر العملية الحسابية</p>

            <div class="choice-cards">
                <div class="choice-card mult-card" onclick="showApp('mult')">
                    <div class="card-icon-wrap">×</div>
                    <div class="card-title">الضرب</div>
                    <div class="card-desc">تدرب على الضرب الرأسي المطور بأرقام عربية أو إنجليزية</div>
                </div>
                <div class="choice-card div-card" onclick="showApp('div')">
                    <div class="card-icon-wrap">÷</div>
                    <div class="card-title">القسمة</div>
                    <div class="card-desc">تدرب على القسمة المطولة بأرقام عربية أو إنجليزية</div>
                </div>
            </div>

            <div class="divider"></div>
            <p class="teacher-sig">منصة التميز الذكية للرياضيات</p>
        </div>
    </div>

    <!-- ===== حاوية iframe للتطبيقات ===== -->
    <div id="app-frame-container">
        <iframe id="app-iframe" src="" allowfullscreen></iframe>
    </div>
